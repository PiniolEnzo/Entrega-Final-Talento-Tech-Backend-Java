spring:
  application:
    name: TechLab
  datasource:
    url: jdbc:h2:file:./data/techlab;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION} # 15 minutes in milliseconds

app:
  frontend:
    url: ${FRONTEND_URL}


mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

server:
  port: ${PORT:8080}